# Machine-readable pin set for the generic image and the host CLI.
#
# Regenerate image.digest after a deliberate base-image bump. Every entry here
# has a matching row in SBOM.md, and vice versa.
schema_version: 1

image:
  name: utest-machinery/mtm
  base: node:24.21.0-bookworm-slim
  # Immutable base digest (docker image inspect node:24.21.0-bookworm-slim --format '{{index .RepoDigests 0}}')
  base_digest: sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
  # Digest of the built generic image is filled in locally by 'mtm install'
  # and recorded in state/, not hard-coded here (it changes when the image is
  # rebuilt): kept empty to avoid claiming an unverified value.
  built_digest: ""

host_cli:
  python: ">=3.11"

tools:
  dagu:
    version: "2.20.1"
    license: GPL-3.0-only
    sha256: 0d5c1612cd842931fe6d4e598fc2e43fb912a94122e571c62a8f73691ea49837
  node:
    version: "24.21.0"
    license: MIT
    note: "Inherited from the pinned base image; not used for LLM inference."
  ruby:
    version: "3.1 (distro package)"
    license: "Ruby / BSD-2-Clause"
    note: "Image runtime for Ceedling. Debian 'ruby' + 'ruby-dev'."
  ceedling:
    version: "1.1.10"
    license: MIT
    note: "Runs in the image; drives the generated functional unit suite and vendors its own pinned Unity 2.7.2 + CMock 2.7.2."
  gcc:
    version: "distro package"
    license: GPL-3.0-or-later (with GCC runtime exception)
    note: "Host-arch C compiler used by Ceedling in the image (plus host feasibility/smoke in PR 2)."
  llvm:
    version: "18.1.8 (clang-18, llvm-18, llvm-18-tools, libclang-rt-18-dev)"
    license: Apache-2.0 WITH LLVM-exception
    note: "Compiler for the PR 3 coverage/MC-DC, ASan/UBSan and -O2 profiles. From apt.llvm.org's bookworm-18 suite; installed under -18-suffixed names (clang-18, llvm-profdata-18, llvm-cov-18)."
  libclang:
    version: "18.1.8 (libclang-18-dev, python3-clang-18)"
    license: Apache-2.0 WITH LLVM-exception
    note: "Sole semantic authority for C declarations/types (owner decision 0017): the mtm/ctypes_clang.py adapter drives libclang-18 via the matching python3-clang-18 bindings, resolved inside the product image from the selected build context. From the same apt.llvm.org bookworm-18 suite."
  valgrind:
    version: "3.19.0"
    license: GPL-2.0-or-later
    note: "Memcheck for the PR 3 valgrind profile; run as a separate executable on the GCC-built suite."
