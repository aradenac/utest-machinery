# Machine-readable pin set for the generic image and the host CLI.
#
# Regenerate image.digest after a deliberate base-image bump. Every entry here
# has a matching row in SBOM.md, and vice versa.
schema_version: 1

image:
  name: utest-machinery/mtm
  base: node:24.21.0-bookworm-slim
  # Immutable base digest (docker image inspect node:24.21.0-bookworm-slim --format '{{index .RepoDigests 0}}')
  base_digest: sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
  # Digest of the built generic image is filled in locally by 'mtm install'
  # and recorded in state/, not hard-coded here (it changes when the image is
  # rebuilt): kept empty to avoid claiming an unverified value.
  built_digest: ""

host_cli:
  python: ">=3.11"

tools:
  dagu:
    version: "2.20.1"
    license: GPL-3.0-only
    sha256: 0d5c1612cd842931fe6d4e598fc2e43fb912a94122e571c62a8f73691ea49837
  node:
    version: "24.21.0"
    license: MIT
  claude-code:
    version: "2.1.302"
    license: "Anthropic commercial (see package LICENSE)"
  claude-code-router:
    version: "3.1.3"
    license: MIT
  unity:
    version: "2.6.0"
    license: MIT
    note: "Vendored core (unity.c/unity.h/unity_internals.h) under mtm/vendor/unity; used to compile the generated suite."
